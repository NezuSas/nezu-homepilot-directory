<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomePilot Directorio</title><link rel="stylesheet" href="/app.css"></head><body><main><header><p>NEZU / HOMEPILOT</p><h1>Mis casas</h1><button id="logout" hidden>Cerrar sesión</button></header><section id="auth"><div class="tabs"><button data-tab="login" class="active">Ingresar</button><button data-tab="register">Crear cuenta</button></div><form id="login"><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="8" required></label><button>Ingresar</button></form><form id="register" hidden><label>Nombre<input name="displayName" required></label><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="8" required></label><button>Crear cuenta</button></form></section><section id="homes" hidden><div class="actions"><button id="new-home">Registrar casa</button></div><form id="home-form" hidden><label>Nombre de la casa<input name="name" required></label><p class="form-help">La conexión segura de tu HomePilot Edge se configurará durante la instalación.</p><button>Guardar casa</button></form><div id="home-list"></div><section class="invitation-action"><h2>Responder invitación</h2><form id="invitation-response"><label>Token de invitación<input name="token" autocomplete="off" required></label><div class="actions"><button name="decision" value="accept">Aceptar</button><button name="decision" value="reject" type="button" id="reject-invitation">Rechazar</button></div></form></section><section id="owner-panel" hidden><h2>Personas de la casa</h2><form id="invite-form"><label>Correo a invitar<input name="email" type="email" required></label><button>Invitar</button></form><p id="invite-result"></p><div id="member-list"></div><section id="edge-pairing"><h2>Conectar HomePilot Edge</h2><p>Genera el código únicamente cuando el instalador esté listo. Crear uno nuevo invalida el anterior.</p><button id="pair-edge" type="button">Generar código de conexión</button><output id="edge-credential" aria-live="polite"></output></section></section></section><p id="notice" role="status"></p></main><script type="module" src="/app.js"></script></body></html>
