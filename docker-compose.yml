services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homepilot_directory
      POSTGRES_USER: homepilot_directory
      POSTGRES_PASSWORD: ${DIRECTORY_POSTGRES_PASSWORD:?Set DIRECTORY_POSTGRES_PASSWORD in .env}
    volumes:
      - directory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepilot_directory -d homepilot_directory"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  homepilot-directory:
    build: .
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      DIRECTORY_JWT_SECRET: ${DIRECTORY_JWT_SECRET:?Set DIRECTORY_JWT_SECRET in .env}
      DATABASE_URL: postgresql://homepilot_directory:${DIRECTORY_POSTGRES_PASSWORD}@postgres:5432/homepilot_directory
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  directory-postgres:
