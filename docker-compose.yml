services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homepilot_directory
      POSTGRES_USER: homepilot_directory
      POSTGRES_PASSWORD: ${DIRECTORY_POSTGRES_PASSWORD:?Set DIRECTORY_POSTGRES_PASSWORD in .env}
    volumes:
      - directory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepilot_directory -d homepilot_directory"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  homepilot-directory:
    build: .
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      DIRECTORY_JWT_SECRET: ${DIRECTORY_JWT_SECRET:?Set DIRECTORY_JWT_SECRET in .env}
      DATABASE_URL: postgresql://homepilot_directory:${DIRECTORY_POSTGRES_PASSWORD}@postgres:5432/homepilot_directory
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      DIRECTORY_AUTH_RATE_LIMIT_MAX: ${DIRECTORY_AUTH_RATE_LIMIT_MAX:-10}
      DIRECTORY_SSO_PRIVATE_KEY: ${DIRECTORY_SSO_PRIVATE_KEY:?Set DIRECTORY_SSO_PRIVATE_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  directory-postgres:
